project_id = "mrap-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Hosted mrap projesi PostgreSQL 17 kullanıyor; shadow doğrulaması aynı ana
# sürümde çalışarak extension ve migration davranış farklarını önler.
major_version = 17

[db.pooler]
enabled = true
port = 6543
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Supabase CLI 2.115 bu adı deprecated olarak işaretliyor; hosted branching
# parser'i local_smtp anahtarını destekleyene kadar iki ortamla uyumlu kalır.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "https://mrap-eta.vercel.app"
additional_redirect_urls = [
  "https://mrap-eta.vercel.app/auth/callback",
  "http://127.0.0.1:3100/auth/callback",
  "http://localhost:3100/auth/callback",
  "http://127.0.0.1:3200/auth/callback",
  "http://localhost:3200/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600
